[project]
name = "llm-routing"
version = "0.1.0"
description = "Offline bandit routing of questions across LLMs from saved model outcomes."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
]

[dependency-groups]
# Analysis libraries for algorithm experiments; uv installs this group by default.
dev = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]
