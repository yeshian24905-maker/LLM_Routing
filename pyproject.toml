[project]
name = "llm-routing"
version = "0.1.0"
description = "Offline bandit routing of questions across LLMs from saved model outcomes."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "scipy>=1.13",
]

[dependency-groups]
# Analysis libraries for algorithm experiments; uv installs this group by default.
dev = [
    "numpy>=2.0",
    "pandas>=2.2",
]
features = [
    "huggingface-hub>=2.4.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.14.1",
]
